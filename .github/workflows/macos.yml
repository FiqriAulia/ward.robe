name: macOS app

on:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build Wardrobe.app
        run: ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Wardrobe-macOS
          path: macos/build/Wardrobe.zip
          if-no-files-found: error
